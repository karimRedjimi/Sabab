    if(c){ S.prayer = {city:c[0], lat:c[1], lng:c[2], method:S.prayer?.method||"uoif"}; save(); render(); }
  }
  if(e.target.id === "pmethod" && S.prayer){ S.prayer.method = e.target.value; save(); render(); }
});

document.getElementById("view").addEventListener("click", async e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act;
  switch(act){
    case "prev": sel = addDays(sel,-1); render(); return;
    case "next": if(!sameDay(sel,today())){ sel = addDays(sel,1); render(); } return;
    case "today": sel = today(); render(); return;
    case "wprev": weekRef = addDays(weekRef,-7); render(); return;
    case "wnext": weekRef = addDays(weekRef,7); render(); return;
    case "goto": sel = fromKey(b.dataset.d); location.hash = "#jour"; if(view==="jour") render(); return;
    case "show": {
      const f = b.dataset.f, others = Object.keys(S.show).filter(k=>k!==f && S.show[k]);
      if(S.show[f] && !others.length){ toast("Garde au moins un texte affiché"); return; }
      S.show[f] = !S.show[f]; save(); render(); return;
    }
    /* Apprendre */
    case "learn": S.learn[b.dataset.id] = {lvl:0, next:keyOf(today())}; save(); render(); toast("Ajoutée à tes révisions"); return;
    case "unlearn": delete S.learn[b.dataset.id]; save(); render(); return;
    case "study": study = {queue:dueIds(), i:0, revealed:false}; render(); window.scrollTo(0,0); return;
    case "reveal": study.revealed = true; render(); return;
    case "grade": gradeCard(b.dataset.g === "1"); return;
    case "endstudy": study = null; render(); return;
    /* Carnet */
    case "adddua": {
      const ta = document.getElementById("newdua"), txt = ta.value.trim();
      if(!txt){ toast("Écris d’abord ton invocation"); ta.focus(); return; }
      S.carnet.push({id:uid8(), text:txt, date:keyOf(today()), status:"wait"}); save(); render(); toast("Ajoutée au carnet"); return;
    }
    case "markans": { carnetEdit = b.dataset.id; carnetDel = null; render(); const ta2 = document.getElementById("how-"+b.dataset.id); if(ta2) ta2.focus(); return; }
    case "cancelans": carnetEdit = null; render(); return;
    case "obnext": {
      const ti = document.getElementById("obtitle"); if(ti) OB.title = ti.value.trim();
      OB.step++; render(); window.scrollTo(0,0); return;
    }
    case "obback": { const ti = document.getElementById("obtitle"); if(ti) OB.title = ti.value.trim(); OB.step = Math.max(0, OB.step-1); render(); return; }
    case "obcat": { const ti = document.getElementById("obtitle"); if(ti) OB.title = ti.value.trim(); OB.cat = OB.cat === b.dataset.k ? null : b.dataset.k; render(); return; }
    case "oblevel": OB.level = b.dataset.k; render(); return;
    case "obramp": OB.ramp = b.dataset.v === "1"; render(); return;
    case "obfinish": {
      const tk = keyOf(today());
      S.onboarded = true;
      if(OB.cat) S.objective = {title:OB.title || OBJ_CATS[OB.cat].l, cat:OB.cat, why:"", since: S.objective?.since || tk};
      if(OB.level){ S.level = OB.level; S.show = {...LEVELS[OB.level].show}; }
      if(OB.ramp){ S.rampStart = tk; S.rampDone = null; } else if(rampWeek(today())) S.rampDone = tk;
      ensure(tk);
      forceOb = false; save();
      sel = today(); location.hash = "#jour"; if(view !== "jour") route(); else route();
      toast("Bismillâh, ton programme commence");
      return;
    }
    case "redoob": OB = {step:0, cat:S.objective?.cat||null, title:S.objective?.title||"", level:S.level, ramp:!!rampWeek(today())}; forceOb = true; location.hash = "#bienvenue"; return;
    case "light": {
      const on = b.dataset.on === "1", r = ensure(keyOf(sel));
      if(on) r.light = true; else delete r.light;
      save(); render();
      toast(on ? "Minimum du jour activé" : "Programme complet rétabli"); return;
    }
    case "rampdone": S.rampDone = keyOf(today()); save(); render(); toast("Programme complet activé"); return;
    case "ramprestart": S.rampStart = keyOf(today()); S.rampDone = null; save(); render(); toast("Démarrage en douceur relancé"); return;
    case "setlevel": S.level = b.dataset.k; S.show = {...LEVELS[b.dataset.k].show}; save(); render(); return;
    case "msec": {
      const m = b.dataset.m, sec = document.getElementById("sec-"+m), open = !sec.classList.contains("closed") ? false : true;
      momentOpen[keyOf(sel)+m] = open; sec.classList.toggle("closed", !open); b.setAttribute("aria-expanded", open); return;
    }
    case "txt": {
      const id = b.dataset.id, art = b.closest("article.item"), it = getItem(id, sel);
      textState[id] = !textOpen(id, it);
      document.querySelectorAll(`article.item[data-id="${id}"]`).forEach(el=> el.outerHTML = entryCard(entryFromEl(el), sel));
      const again = document.querySelector(`#${art.id} [data-act="txt"]`); if(again) again.focus({preventScroll:true});
      return;
    }
    case "gonext": {
      const m = b.dataset.m, sec = document.getElementById("sec-"+m);
      if(sec && sec.classList.contains("closed")){ momentOpen[keyOf(sel)+m] = true; sec.classList.remove("closed"); sec.querySelector(".mhead").setAttribute("aria-expanded", true); }
      const card = document.getElementById(b.dataset.card);
      if(card){ card.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"center"}); const f = card.querySelector("[data-k]"); if(f) setTimeout(()=>f.focus({preventScroll:true}), 350); }
      return;
    }
    case "bkind": BL.kind = b.dataset.k; BL.ref = BL.kind === "semaine" ? monday(today()) : new Date(today().getFullYear(), today().getMonth(), 1); render(); return;
    case "bprev": BL.ref = BL.kind === "semaine" ? addDays(BL.ref,-7) : new Date(BL.ref.getFullYear(), BL.ref.getMonth()-1, 1); render(); return;
    case "bnext": BL.ref = BL.kind === "semaine" ? addDays(BL.ref,7) : new Date(BL.ref.getFullYear(), BL.ref.getMonth()+1, 1); render(); return;
    case "openbilan": {
      if(b.dataset.p === "lastweek"){ BL.kind = "semaine"; BL.ref = addDays(monday(today()),-7); }
      else { BL.kind = "mois"; BL.ref = new Date(today().getFullYear(), today().getMonth()-1, 1); }
      location.hash = "#bilan"; return;
    }
    case "sharecarnet": {
      const x = S.carnet.find(c=>c.id===b.dataset.id); if(!x) return;
      T = {cat:"autre", asked:x.text, how:x.how||"", effort:"", delay:"", kind:"exact", carnetId:x.id};
      location.hash = "#temoigner"; return;
    }
    case "pray": {
      const id = b.dataset.id;
      if(S.prayed[id]) return;
      S.prayed[id] = keyOf(today()); save(); buzz(15);
      toast("Qu’Allah l’exauce, et pour toi de même");
      rerenderIf(["demandes","communaute"]); return;
    }
    case "hamd": {
      const id = b.dataset.id;
      if(S.hamd[id]) delete S.hamd[id]; else S.hamd[id] = keyOf(today());
      save(); rerenderIf(["exaucees","communaute"]); return;
    }
    case "postreq": {
      const txt = document.getElementById("reqtext").value.trim(), cat = document.getElementById("reqcat").value;
      const pseudo = document.getElementById("reqpseudo").value.trim().slice(0,30);
      if(txt.length < 10){ toast("Décris ton besoin en une ou deux phrases"); return; }
      S.pseudo = pseudo;
      try{
        const ref = await store.db.collection("requests").add({cat, text:txt.slice(0,300), pseudo, at:Date.now(), answered:false});
        S.myReq.push(ref.id); save();
        document.getElementById("reqtext").value = "";
        toast("Demande publiée. La communauté va invoquer pour toi");
      }catch(err){ toast(err && err.code==="quota_exceeded" ? "Espace plein, la demande n’a pas été publiée" : "La publication a échoué, réessaie"); }
      return;
    }
    case "reqanswered": {
      const r = C.requests.find(x=>x.id===b.dataset.id); if(!r) return;
      try{ await store.db.doc(`requests/${r.id}`).update({answered:true, answeredAt:Date.now()}); }catch(err){}
      T = {cat:r.cat, asked:r.text, how:"", effort:"", delay:"", kind:"exact"};
      location.hash = "#temoigner"; return;
    }
    case "delpost": {
      const col = b.dataset.col, id = b.dataset.id;
      if(C.confirmDel !== id){ C.confirmDel = id; rerenderIf([view]); return; }
      try{ await store.db.doc(`${col}/${id}`).delete(); toast("Publication supprimée"); }catch(err){ toast("La suppression a échoué"); }
      S.myReq = S.myReq.filter(x=>x!==id); S.myTest = S.myTest.filter(x=>x!==id); C.confirmDel = null; save(); return;
    }
    case "filter": C.filter = b.dataset.f; render(); return;
    case "posttest": {
      const g = id => (document.getElementById(id)?.value||"").trim();
      const t = {cat:g("tcat"), kind:g("tkind"), asked:g("tasked").slice(0,200), how:g("thow").slice(0,600), effort:g("teffort").slice(0,300), delay:g("tdelay"), pseudo:g("tpseudo").slice(0,30)};
      if(t.asked.length < 5 || t.how.length < 10){ toast("Indique ce que tu as demandé et comment c’est arrivé"); return; }
      S.pseudo = t.pseudo;
      try{
        const ref = await store.db.collection("testimonies").add({...t, at:Date.now()});
        S.myTest.push(ref.id);
        if(T && T.carnetId){ const x = S.carnet.find(c=>c.id===T.carnetId); if(x) x.shared = true; }
        T = null; save(); toast("Témoignage publié, al-hamdulillâh"); location.hash = "#exaucees";
      }catch(err){ toast(err && err.code==="quota_exceeded" ? "Espace plein, le témoignage n’a pas été publié" : "La publication a échoué, réessaie"); }
      return;
    }
    case "answer": {
      const x = S.carnet.find(c=>c.id===b.dataset.id); if(!x) return;
      x.status = "ok"; x.answered = keyOf(today()); x.how = (document.getElementById("how-"+x.id)?.value||"").trim();
      carnetEdit = null; save(); render(); toast("Al-hamdu lillâh"); buzz([30,60,30]); return;
    }
    case "unans": { const x = S.carnet.find(c=>c.id===b.dataset.id); if(x){ x.status = "wait"; delete x.answered; } save(); render(); return; }
    case "del": carnetDel = b.dataset.id; render(); return;
    case "delok": S.carnet = S.carnet.filter(c=>c.id!==b.dataset.id); carnetDel = null; save(); render(); toast("Supprimée du carnet"); return;
    /* Objectif */
    case "saveobj": {
      const title = document.getElementById("otitle").value.trim();
      if(!title){ toast("Écris ton objectif en une phrase"); return; }
      const since = S.objective?.since || keyOf(today());
      S.objective = {title, cat:document.getElementById("ocat").value, why:document.getElementById("owhy").value.trim(), since};
      save(); render(); toast("Objectif enregistré"); return;
    }
    case "delobj": S.objective = null; save(); render(); return;
    /* Parcours */
    case "startparc": S.parcours = {id:b.dataset.id, start:keyOf(today())}; save(); toast(`Parcours commencé : jour 1 sur ${PARCOURS_DAYS}`); location.hash = "#jour"; return;
    case "stopparc": S.parcours = null; save(); render(); return;
    /* Prière */
    case "geoloc": {
      if(!navigator.geolocation){ toast("Position indisponible : choisis ta ville dans la liste"); return; }
      navigator.geolocation.getCurrentPosition(pos=>{
        S.prayer = {city:"Ma position", lat:+pos.coords.latitude.toFixed(4), lng:+pos.coords.longitude.toFixed(4), method:S.prayer?.method||"uoif"}; if(view==="bienvenue") lsSet(); else save(); render();
      }, ()=> toast("Position refusée : choisis ta ville dans la liste"), {timeout:10000});
      return;
    }
    /* Binôme */
    case "mkcircle": S.binome = {code:newCode()}; save(); B.code = undefined; render(); pushBinome(); return;
    case "joincircle": {
      const c = (document.getElementById("joincode").value||"").trim().toUpperCase();
      if(!/^[A-Z0-9]{6}$/.test(c)){ toast("Le code compte 6 caractères"); return; }
      S.binome = {code:c}; save(); B.code = undefined; render(); pushBinome(); toast("Cercle rejoint"); return;
    }
    case "leavecircle": S.binome = null; save(); B.code = undefined; binomeSubscribe(); render(); pushBinome(); return;
    case "encfor": B.encFor = b.dataset.to; render(); return;
    case "sendenc": {
      try{ await store.db.collection("encouragements").add({code:S.binome.code, to:b.dataset.to, from:store.uid, i:+b.dataset.i, at:Date.now()}); toast("Encouragement envoyé"); }
      catch(err){ toast(err && err.code==="quota_exceeded" ? "Le cercle a atteint sa limite de messages" : "L’envoi a échoué, réessaie"); }
      B.encFor = null; render(); return;
    }
  }
  /* Cocher et compter */
  const k = b.dataset.k; if(!k) return;
  const [id, si] = k.split(":");
  const target = slotsOf(id)[+si].t, dk = keyOf(sel), before = dayPct(sel);
  const r = ensure(dk); r.c = r.c || {};
  const v = r.c[k] || 0;
  if(act === "toggle"){ r.c[k] = v >= 1 ? 0 : 1; buzz(12); }
  else if(act === "inc"){ r.c[k] = v + 1; buzz(8); if(r.c[k] === target){ buzz([20,40,20]); toast(`${slotsOf(id)[+si].l} : ${target} atteint`); } }
  else if(act === "dec"){ r.c[k] = Math.max(0, v-1); }
  else if(act === "reset"){ if(v===0) return; r.c[k] = 0; toast("Compteur remis à zéro"); }
  if(!r.c[k]) delete r.c[k];
  save(); refreshJourAfter(b, id);
  const after = dayPct(sel);
  if(after >= 1 && before < 1){ toast("Journée complète, qu’Allah l’accepte"); buzz([30,60,30,60,30]); }
  else if(after >= HELD && before < HELD) toast("Journée tenue");
});

/* =========================================================
   DÉMARRAGE ET SYNCHRONISATION
   ========================================================= */
function updateStatus(){
  const s = document.getElementById("status"); if(!s) return;
  s.textContent = store.mode === "account" ? "Ta progression est enregistrée sur ton compte et te suit sur tous tes appareils." : "Ta progression est enregistrée sur cet appareil.";
}
function withTimeout(p, ms){ return Promise.race([p, new Promise(r=>setTimeout(()=>r(null), ms))]); }
async function init(){
  merge(lsGet());
  if(!Object.keys(S.learn).length && !lsGet()) SOCLE.forEach(id=> S.learn[id] = {lvl:0, next:keyOf(today())});
  route();
  try{
    if(!window.claude || typeof window.claude.use !== "function") return;
    const [db, user] = await Promise.all([withTimeout(window.claude.use("db"),10000), withTimeout(window.claude.use("user"),10000)]);
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    const ref = db.doc(`data/users/${uid}/tracker`);
    const snap = await withTimeout(ref.get(), 10000); if(!snap) return;
    store = {mode:"account", ref, db, user, uid};
    const remote = snap.exists ? snap.data() : null;
    if(remote && (remote.updated||0) > (S.updated||0)){ merge(remote); lsSet(); }
    else if(S.updated) pushRemote();
    if(!S.anonId){ S.anonId = "m" + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); save(); }
    try{ C.owner = await user.isOwner(); }catch(e){}
    commuSubscribe();
    pushTally();
    pushBinome();
    if(view === "bienvenue" && !needsOnboarding() && !forceOb) route();
    else { const y = window.scrollY; render(); window.scrollTo(0,y); }
  }catch(e){ store.mode = "local"; updateStatus(); }
}
let lastToday = keyOf(today());
setInterval(()=>{
  const k = keyOf(today());
  if(k !== lastToday){ if(keyOf(sel) === lastToday) sel = today(); lastToday = k; render(); pushBinome(); }
  else if(view === "jour" && S.prayer && sameDay(sel,today())){ const ps = document.querySelector(".prayers"); if(ps) ps.outerHTML = prayerStrip(sel); }
}, 60000);
init();
</script>
