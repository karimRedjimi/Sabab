<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programme du rizq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400..650;1,6..72,400..500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECF0E8; --surface:#F8FAF5; --ink:#13302A; --muted:#586C63; --line:#D2DACF;
  --accent:#1E5D4D; --accent-ink:#F8FAF5; --brass:#9C7128; --soft:#E0EBE2; --brass-soft:#F2EADB;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1916; --surface:#15231F; --ink:#E6EDE5; --muted:#97AAA1; --line:#263731;
    --accent:#62B79C; --accent-ink:#0E1916; --brass:#D5AB5E; --soft:#1B312A; --brass-soft:#2A2618;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1916; --surface:#15231F; --ink:#E6EDE5; --muted:#97AAA1; --line:#263731;
  --accent:#62B79C; --accent-ink:#0E1916; --brass:#D5AB5E; --soft:#1B312A; --brass-soft:#2A2618;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Newsreader",Georgia,"Times New Roman",serif;font-size:17px;line-height:1.55;font-optical-sizing:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:8px}
.app{max-width:640px;margin:0 auto;padding:20px 18px 120px}
a{color:var(--accent)}

/* En-tête du jour */
.dayhead{display:grid;grid-template-columns:1fr auto;gap:12px 18px;align-items:center;padding:8px 0 18px}
.dayhead h1{font-size:2.6rem;line-height:1.05;font-weight:500;letter-spacing:-.015em;margin:0}
.dayhead .date{color:var(--muted);margin:4px 0 0;font-size:1rem}
.dayhead .theme{margin:10px 0 0;font-style:italic;color:var(--brass);font-size:1.2rem;line-height:1.3}
.bigstar{width:112px;height:112px;position:relative}
.bigstar svg{width:100%;height:100%;display:block}
.bigstar .pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:1.25rem;font-variant-numeric:tabular-nums}
.bigstar .pct.on{color:var(--accent-ink)}
.star-outline{fill:none;stroke:var(--accent);stroke-width:1.6}
.star-base{fill:var(--soft)}
.star-fill{fill:var(--accent);transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.datenav{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.navbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;display:inline-flex;align-items:center;gap:6px;font-size:.95rem;text-decoration:none;color:var(--ink)}
.navbtn:disabled{opacity:.4;cursor:default}
.navbtn svg{width:16px;height:16px}
.navbtn.strong{border-color:var(--accent);color:var(--accent)}
.navbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.datenav .today{margin-left:auto}

/* Horaires */
.prayers{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px 10px;margin:0 0 18px}
.prow{display:grid;grid-template-columns:repeat(6,1fr);text-align:center;gap:2px}
.prow div{padding:4px 0;border-radius:10px}
.prow b{display:block;font-variant-numeric:tabular-nums;font-weight:600;font-size:1.02rem}
.prow span{font-size:.78rem;color:var(--muted)}
.prow .next{background:var(--soft)}
.prow .next span{color:var(--accent)}
.windows{margin:8px 6px 0;font-size:.92rem;color:var(--muted);display:grid;gap:2px}
.windows .now{color:var(--accent);font-weight:600}
.windows .fri{color:var(--brass)}
.setup{background:var(--brass-soft);border-radius:16px;padding:14px 16px;margin:0 0 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.setup p{margin:0;font-size:.98rem}

.display{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 22px;font-size:.92rem;color:var(--muted)}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:.92rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* Sections */
.sec{margin:0 0 30px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:14px}
.sechead h2{font-size:1.3rem;font-weight:600;margin:0}
.sechead .count{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.secintro{color:var(--muted);margin:-6px 0 14px;font-size:.98rem}
.page h1{font-size:2.2rem;font-weight:500;letter-spacing:-.012em;margin:6px 0 8px;line-height:1.1}
.lead{font-size:1.06rem;margin:0 0 24px;max-width:62ch;color:var(--muted)}

/* Cartes */
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;margin-bottom:12px;transition:border-color .25s, box-shadow .25s}
.item.theme-item{box-shadow:inset 3px 0 0 var(--brass)}
.item.done{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.item.objective{background:var(--brass-soft);border-color:transparent}
.item.objective.done{border-color:var(--accent)}
.itemhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.itemhead h3{margin:0;font-size:1.15rem;font-weight:600;line-height:1.3}
.moment{margin:2px 0 0;color:var(--muted);font-size:.93rem}
.badge{flex:none;font-size:.78rem;border-radius:999px;padding:2px 9px;border:1px solid;white-space:nowrap;margin-top:2px}
.g-coran{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.g-sahih{border-color:var(--accent);color:var(--accent)}
.g-hasan{border-color:var(--brass);color:var(--brass)}
.g-opt{border-color:var(--line);color:var(--muted)}
.ar{font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic","Geeza Pro",serif;font-size:1.75rem;line-height:2.1;text-align:right;margin:12px 0 6px;color:var(--ink)}
.ph{margin:6px 0;font-style:italic}
.fr{margin:6px 0;color:var(--muted)}
.desc{margin:10px 0 4px;color:var(--muted)}
.src{margin:8px 0 0;font-size:.88rem;color:var(--muted)}
.src b{font-weight:600;color:var(--ink)}
details{margin-top:6px}
summary{cursor:pointer;color:var(--accent);font-size:.92rem;list-style:none;display:inline-flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
details[open] summary::before{transform:rotate(45deg)}
details p{margin:8px 0 0;font-size:.98rem}

.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tog{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 16px 8px 10px;font-size:.98rem}
.tog .box{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--muted);display:grid;place-items:center;flex:none}
.tog .box svg{width:13px;height:13px;opacity:0}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tog[aria-pressed="true"] .box{border-color:var(--accent-ink);background:var(--accent-ink)}
.tog[aria-pressed="true"] .box svg{opacity:1;stroke:var(--accent)}
.counter{flex:1 1 220px;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:stretch}
.tap{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 14px;text-align:left;min-height:68px;display:flex;flex-direction:column;justify-content:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tap .bar{position:absolute;inset:auto 0 0 0;height:4px;background:var(--line)}
.tap .bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.tap .num{font-size:1.6rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tap .num small{font-size:.95rem;font-weight:400;color:var(--muted)}
.tap .lbl{font-size:.88rem;color:var(--muted);margin-top:4px}
.tap.full{border-color:var(--accent);background:var(--soft)}
.tap:active{transform:scale(.985)}
.mini{border:1px solid var(--line);background:transparent;border-radius:12px;padding:0 12px;color:var(--muted);font-size:.9rem;min-width:44px}

/* Formulaires */
.field{display:block;margin:0 0 14px}
.field > span{display:block;font-size:.93rem;color:var(--muted);margin-bottom:5px}
.input,.select,.area{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:1rem}
.area{min-height:100px;resize:vertical}
.item .input{background:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{color:var(--muted);font-size:.88rem;margin:8px 0 0}

/* Semaine / suivi */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.weeknav h3{font-size:1.15rem;font-weight:600;margin:0}
.weeknav p{margin:0;color:var(--muted);font-size:.9rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn:disabled{opacity:.35;cursor:default}
.dayrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin-bottom:8px}
.dayrow.is-today{border-color:var(--brass)}
.dayrow:disabled{opacity:.55;cursor:default}
.dayrow svg{width:44px;height:44px;display:block}
.dayrow .dn{font-weight:600}
.dayrow .dt{color:var(--muted);font-size:.9rem;font-style:italic}
.dayrow .dp{font-variant-numeric:tabular-nums;font-weight:600}
.stats{display:flex;gap:10px;margin:0 0 18px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:1.7rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.88rem;line-height:1.3;display:block}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0 6px}
.heat .hd{font-size:.8rem;color:var(--muted);text-align:center}
.cell{aspect-ratio:1;border-radius:8px;background:var(--soft);border:0;padding:0;font-size:.72rem;color:var(--muted);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cell.l1{background:color-mix(in srgb,var(--accent) 25%,var(--surface))}
.cell.l2{background:color-mix(in srgb,var(--accent) 50%,var(--surface))}
.cell.l3{background:color-mix(in srgb,var(--accent) 75%,var(--surface));color:var(--accent-ink)}
.cell.l4{background:var(--accent);color:var(--accent-ink)}
.cell.out{background:transparent;border:1px dashed var(--line)}
.cell.now{outline:2px solid var(--brass);outline-offset:1px}
.legend{display:flex;align-items:center;gap:5px;font-size:.82rem;color:var(--muted);justify-content:flex-end}
.legend .cell{width:14px;height:14px;border-radius:4px;aspect-ratio:auto}
.neg{list-style:none;padding:0;margin:0}
.neg li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.neg .np{font-variant-numeric:tabular-nums;color:var(--muted)}
.neg .nb{grid-column:1/-1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.neg .nb i{display:block;height:100%;background:var(--brass)}
.empty{color:var(--muted);font-style:italic}

/* Apprendre */
.learnbar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin:8px 0 4px}
.learnbar i{display:block;height:100%;background:var(--accent)}
.lrow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow .lt{font-weight:500}
.lrow .ls{font-size:.88rem;color:var(--muted)}
.lv{display:flex;gap:4px;margin-top:4px}
.lv i{width:16px;height:5px;border-radius:3px;background:var(--line)}
.lv i.on{background:var(--accent)}
.study{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.study .step{color:var(--muted);font-size:.9rem;margin:0 0 6px}
.study h2{margin:0 0 4px;font-size:1.35rem;font-weight:600}
.cue{background:var(--brass-soft);border-radius:12px;padding:10px 12px;margin:12px 0}
.mask{display:inline-block;height:.9em;vertical-align:-.05em;border-radius:4px;background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.ar .mask{height:.7em}
.studyactions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.studyactions button{flex:1 1 140px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:1rem}
.studyactions .ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Carnet */
.dua{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.dua.answered{background:var(--soft);border-color:transparent}
.dua p{margin:0}
.dua .dt{font-size:.88rem;color:var(--muted);margin-top:6px}
.dua .how{margin-top:8px;font-style:italic}
.dua .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-size:.93rem;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--muted)}

/* Parcours / plus */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:1.12rem}
.card p{margin:0 0 10px;color:var(--muted);font-size:.98rem}
.card.active{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.acc{background:var(--brass-soft);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.acc h3{margin:0 0 4px;font-size:1.08rem}
.acc p{margin:0;font-size:.98rem}
.acc .src{margin-top:6px}
.menu{list-style:none;margin:0;padding:0}
.menu a{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.menu a span{color:var(--muted);font-size:.92rem}

/* Binôme */
.member{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.member .mn{font-weight:600}
.member .ms{font-size:.9rem;color:var(--muted)}
.member .ms.ok{color:var(--accent)}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.enc{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.code{font-size:2rem;letter-spacing:.18em;font-weight:600;font-variant-numeric:tabular-nums}

/* Communauté */
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;margin:0 0 22px}
.seg a{flex:1;text-align:center;padding:8px 6px;border-radius:999px;text-decoration:none;color:var(--muted);font-size:.93rem}
.seg a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.pulse{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px;margin:0 0 18px}
.pulse b{font-size:2.2rem;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;display:block}
.pulse p{margin:6px 0 0}
.pulse .sub{opacity:.85;font-size:.93rem}
.banner{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 18px}
.banner b{color:var(--accent)}
.banner span{display:block;font-size:.9rem;color:var(--muted);margin-top:2px}
.challenge{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.challenge h3{margin:0;font-size:1.08rem}
.challenge .big{font-variant-numeric:tabular-nums;font-weight:600;font-size:1.3rem}
.challenge .learnbar{height:10px;border-radius:5px}
.challenge p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.feed{list-style:none;padding:0;margin:0}
.feed li{padding:11px 0 11px 18px;border-bottom:1px solid var(--line);position:relative}
.feed li::before{content:"";position:absolute;left:2px;top:20px;width:7px;height:7px;transform:rotate(45deg);background:var(--brass)}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.group.mine{border-color:var(--accent)}
.group h4{margin:0 0 4px;font-size:.98rem;line-height:1.25}
.group p{margin:0;font-size:.86rem;color:var(--muted)}
.post{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.post.mine{border-color:var(--brass)}
.post .meta{display:flex;justify-content:space-between;gap:10px;font-size:.86rem;color:var(--muted);margin-bottom:6px}
.post .cat{color:var(--brass);font-weight:600}
.post p{margin:0 0 6px}
.post .lab{font-size:.86rem;color:var(--muted);display:block;margin-top:8px}
.post .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.pray{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:7px 14px;font-size:.95rem}
.pray[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.kind{display:inline-block;font-size:.8rem;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--accent);margin-bottom:6px}
.warn{background:var(--brass-soft);border-radius:12px;padding:10px 12px;font-size:.9rem;margin:0 0 14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}

/* Accueil et accompagnement */
.tabs[hidden]{display:none}
.ob{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;padding:10px 0 40px}
.ob .stepper{display:flex;gap:6px;margin:0 0 26px}
.ob .stepper i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.ob .stepper i.on{background:var(--accent)}
.ob h1{font-size:2.3rem;font-weight:500;letter-spacing:-.015em;line-height:1.1;margin:0 0 12px}
.ob .lead{margin-bottom:22px}
.ob .star{width:84px;height:84px;margin:0 0 22px}
.choices{display:grid;gap:8px;margin:0 0 18px}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 16px;font-size:1.02rem}
.choice small{display:block;color:var(--muted);font-size:.88rem;margin-top:2px}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--soft)}
.obnav{display:flex;gap:10px;align-items:center;margin-top:8px}
.obnav .navbtn.primary{padding:12px 22px;font-size:1.02rem}
.recap{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin:0 0 18px}
.recap p{margin:0;padding:10px 0;border-bottom:1px solid var(--line)}
.recap p:last-child{border-bottom:0}
.recap b{font-weight:600}
.coach{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 18px}
.coach.warm{background:var(--brass-soft);border-color:transparent}
.coach.light{background:var(--soft);border-color:transparent}
.coach p{margin:0 0 8px}
.coach .src{margin:0 0 10px}
.coach .row{margin-top:4px}
.quiet{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 18px;color:var(--muted);font-size:.95rem}

/* Journée par moments */
.nextstep{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px 12px 16px;margin:0 0 18px}
.nextstep p{margin:0;font-size:.98rem;line-height:1.35}
.nextstep p span{display:block;opacity:.75;font-size:.9rem}
.nextstep button{flex:none;border:0;background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:.93rem}
.nextstep.done{background:var(--accent);color:var(--accent-ink)}
.msec{margin:0 0 14px}
.mhead{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0 8px;text-align:left}
.mhead h2{margin:0;font-size:1.3rem;font-weight:600;flex:1}
.mhead h2 small{display:block;font-size:.88rem;font-weight:400;color:var(--muted)}
.mhead .count{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.mhead .chev{width:10px;height:10px;border-right:1.8px solid var(--muted);border-bottom:1.8px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px 0;transition:transform .2s}
.msec.closed .chev{transform:rotate(-45deg);margin-bottom:0}
.nowtag{display:inline-block;margin-left:8px;font-size:.75rem;font-weight:600;vertical-align:middle;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 8px}
.mbody{padding-top:12px}
.msec.closed .mbody{display:none}
.msec.alldone .mhead h2{color:var(--accent)}
.tag{display:inline-block;font-size:.76rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin:4px 6px 0 0}
.tag.t-theme{color:var(--brass);border-color:var(--brass)}
.tag.t-parc{color:var(--accent);border-color:var(--accent)}
.txtbtn{background:none;border:0;padding:6px 0 0;color:var(--accent);font-size:.92rem;text-decoration:underline;text-underline-offset:3px}
.item.compact .slots{margin-top:10px}

/* Bilan */
.bnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px}
.bnav h3{margin:0;font-size:1.1rem;text-align:center}
.wkstars{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin:0 0 18px}
.wkstars svg{width:100%;max-width:44px;height:auto;display:block;margin:0 auto}
.wkstars span{font-size:.78rem;color:var(--muted)}
.blist{list-style:none;padding:0;margin:0}
.blist li{padding:9px 0;border-bottom:1px solid var(--line)}
.blist li small{display:block;color:var(--muted);font-size:.86rem}
.delta{font-size:.93rem;opacity:.9;margin-top:6px}

/* Barre du bas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 1px 10px;color:var(--muted);text-decoration:none;font-size:.72rem;white-space:nowrap}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:420px){
  .dayhead h1{font-size:2.15rem}
  .bigstar{width:92px;height:92px}
  .ar{font-size:1.55rem}
  .prow b{font-size:.92rem}
  .prow span{font-size:.7rem}
  .stats{flex-wrap:wrap}
  .stat{flex:1 1 40%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const GRADES = {coran:{label:"Coran",cls:"g-coran"}, sahih:{label:"Sahîh",cls:"g-sahih"}, hasan:{label:"Hasan",cls:"g-hasan"}};

const ITEMS = {
  fajr:{kind:"dua",title:"Invocation après le Fajr",moment:"Après la prière du Fajr",when:"fajr",
    ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا",
    ph:"Allâhumma innî as’aluka ʿilman nâfiʿan, wa rizqan tayyiban, wa ʿamalan mutaqabbalan.",
    fr:"Ô Allah, je Te demande une science utile, une subsistance pure et des œuvres acceptées.",
    grade:"sahih",src:"Ibn Mâjah (n° 925), authentifié par Al-Albânî",
    note:"Le Prophète ﷺ la disait après avoir terminé la prière du Fajr. Elle place le rizq « pur » au cœur de la journée, dès son ouverture."},
  sayyid:{kind:"dua",title:"Sayyid al-istighfâr",moment:"Matin et soir",
    ar:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",
    ph:"Allâhumma anta rabbî, lâ ilâha illâ ant, khalaqtanî wa ana ʿabduk, wa ana ʿalâ ʿahdika wa waʿdika mastataʿt, aʿûdhu bika min sharri mâ sanaʿt, abû’u laka bi niʿmatika ʿalayy, wa abû’u bi dhanbî faghfir lî, fa innahu lâ yaghfirudh-dhunûba illâ ant.",
    fr:"Ô Allah, Tu es mon Seigneur, il n’y a de divinité que Toi. Tu m’as créé et je suis Ton serviteur. Je respecte Ton pacte et Ta promesse autant que je le peux. Je cherche refuge auprès de Toi contre le mal que j’ai commis. Je reconnais Tes bienfaits envers moi et je reconnais mon péché : pardonne-moi, car nul ne pardonne les péchés en dehors de Toi.",
    grade:"sahih",src:"Al-Bukhârî (n° 6306)",
    note:"Le « maître des demandes de pardon ». Celui qui la dit le jour avec certitude et meurt avant le soir fait partie des gens du Paradis, et de même s’il la dit le soir et meurt avant le matin.",
    slots:[{l:"Matin",t:1},{l:"Soir",t:1}]},
  istighfar:{kind:"dua",title:"Istighfâr",moment:"Tout au long de la journée",
    ar:"أَسْتَغْفِرُ اللَّهَ",ph:"Astaghfirullâh.",fr:"Je demande pardon à Allah.",

    slots:[{l:"Objectif du jour",t:100}]},
  hasbi:{kind:"dua",title:"Hasbiyallâh",moment:"7 fois le matin, 7 fois le soir",
    ar:"حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ",

    slots:[{l:"Matin",t:7},{l:"Soir",t:7}]},
  hayy:{kind:"dua",title:"Yâ Hayyu yâ Qayyûm",moment:"Matin et soir",
    ar:"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ",

    grade:"hasan",src:"An-Nasâ’î (As-Sunan al-Kubrâ) et Al-Hâkim, jugé hasan par Al-Albânî",

    slots:[{l:"Matin",t:1},{l:"Soir",t:1}]},

  musa:{kind:"dua",title:"L’invocation de Moïse",moment:"Autant que possible dans la journée",
    ar:"رَبِّ إِنِّي لِمَا أَنْزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ",

  jeuneLun:{kind:"action",title:"Jeûner le lundi",optional:true,

    grade:"sahih",src:"Muslim (n° 1162) ; At-Tirmidhî (n° 747)",
    note:"Le Prophète ﷺ jeûnait le lundi et le jeudi, et expliquait que les œuvres sont présentées à Allah ces jours-là, et qu’il aimait que les siennes le soient pendant qu’il jeûnait."},
  dette:{kind:"dua",title:"Invocation contre les dettes",moment:"Après les prières, ou au moins une fois",
    ar:"اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ",
    ph:"Allâhumma-kfinî bi halâlika ʿan harâmik, wa aghninî bi fadlika ʿamman siwâk.",
    fr:"Ô Allah, suffis-moi par Ton licite pour que je me passe de Ton illicite, et enrichis-moi par Ta grâce pour que je n’aie besoin de personne d’autre que Toi.",
    grade:"hasan",src:"At-Tirmidhî (n° 3563)",
    note:"ʿAlî l’a enseignée à un homme accablé par une dette, en lui disant que même avec une dette grande comme une montagne, Allah l’en acquitterait."},
  detteAct:{kind:"action",title:"Régler ou planifier une dette",
    desc:"Même petite : un remboursement, un échéancier, un appel pour régulariser. L’invocation accompagne l’effort, elle ne le remplace pas."},
  hamm:{kind:"dua",title:"Refuge contre le souci et la paresse",moment:"Matin et soir",
    ar:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ، وَغَلَبَةِ الرِّجَالِ",
    ph:"Allâhumma innî aʿûdhu bika minal-hammi wal-hazan, wal-ʿajzi wal-kasal, wal-bukhli wal-jubn, wa dalaʿid-dayni wa ghalabatir-rijâl.",
    fr:"Ô Allah, je cherche refuge auprès de Toi contre le souci et la tristesse, l’incapacité et la paresse, l’avarice et la lâcheté, le poids des dettes et la domination des hommes.",
    grade:"sahih",src:"Al-Bukhârî (n° 6369)",
    note:"Anas rapporte que le Prophète ﷺ la disait très souvent. Elle vise exactement ce qui bloque l’abondance : l’angoisse, la procrastination et l’endettement.",
    slots:[{l:"Matin",t:1},{l:"Soir",t:1}]},
  hammAct:{kind:"action",title:"Avancer sur la tâche que tu repousses",
    desc:"Celle que tu reportes depuis le plus longtemps. Même trente minutes suffisent pour casser le blocage."},
  sabr:{kind:"dua",title:"Invocation de la patience",moment:"Dans la journée",
    ar:"رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ",
    ph:"Rabbanâ afrigh ʿalaynâ sabran wa tawaffanâ muslimîn.",
    fr:"Seigneur, déverse sur nous l’endurance et fais-nous mourir entièrement soumis à Toi.",
    grade:"coran",src:"Coran, Al-Aʿrâf 7:126",
    note:"C’est l’invocation des magiciens de Pharaon devenus croyants, au moment où ils étaient menacés. Elle demande une patience qui se « déverse » en abondance."},

    grade:"sahih",src:"At-Tirmidhî (n° 747)",note:"Les œuvres sont présentées à Allah le lundi et le jeudi."},
  bilan:{kind:"action",title:"Faire le bilan de la semaine",
    desc:"Qu’est-ce qui a avancé, qu’est-ce qui a bloqué ? Écris-le dans la note du jour, en bas de page."},
  salawat:{kind:"dua",title:"Prière sur le Prophète ﷺ",moment:"En abondance toute la journée",
    ar:"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ",
    ph:"Allâhumma salli ʿalâ Muhammadin wa ʿalâ âli Muhammad.",

    slots:[{l:"Objectif conseillé",t:100}]},
  kahf:{kind:"action",title:"Lire la sourate Al-Kahf",desc:"Entre le coucher du soleil du jeudi et celui du vendredi.",

  sadaqa:{kind:"action",title:"Donner une aumône",desc:"Le montant importe peu : la régularité compte plus que la taille.",

    ph:"Allâhumma akthir mâlî wa waladî, wa bârik lî fîmâ aʿtaytanî.",

  rahim:{kind:"action",title:"Appeler ou visiter un proche",desc:"Un parent, un frère, une tante, quelqu’un avec qui le lien s’est distendu.",

  atina:{kind:"dua",title:"Le bien des deux mondes",moment:"Dans la journée et dans la prosternation",
    ar:"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",

  yunus:{kind:"dua",title:"L’invocation de Yûnus",moment:"Dans la journée",
    ar:"لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ",
    ph:"Lâ ilâha illâ anta, subhânaka, innî kuntu minaz-zâlimîn.",

  plan:{kind:"action",title:"Planifier la semaine à venir",desc:"Trois priorités concrètes, pas plus. Le tawakkul commence par un plan."},

  /* Invocations des parcours */
  fadl:{kind:"dua",title:"Demander de la grâce d’Allah",moment:"En sortant de la mosquée, et dans la journée",
    ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ",ph:"Allâhumma innî as’aluka min fadlik.",

function pad(n){ return String(n).padStart(2,"0"); }
function keyOf(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function fromKey(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function today(){ const t = new Date(); t.setHours(0,0,0,0); return t; }
function sameDay(a,b){ return keyOf(a) === keyOf(b); }
function monday(d){ return addDays(d, -((d.getDay()+6)%7)); }
function diffDays(a,b){ return Math.round((a - b)/86400000); }
function fmtDate(d){ return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function fmtShort(d){ return `${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* =========================================================
   HORAIRES DE PRIÈRE (algorithme astronomique)
   ========================================================= */
const rad = d=>d*Math.PI/180, deg = r=>r*180/Math.PI;
const dsin = d=>Math.sin(rad(d)), dcos = d=>Math.cos(rad(d)), dtan = d=>Math.tan(rad(d));
const darcsin = x=>deg(Math.asin(x)), darccos = x=>deg(Math.acos(x)), darctan2 = (y,x)=>deg(Math.atan2(y,x)), darccot = x=>deg(Math.atan(1/x));
const fix = (a,b)=>{ a = a - b*Math.floor(a/b); return a<0 ? a+b : a; };
function julian(y,m,d){ if(m<=2){ y--; m+=12; } const A = Math.floor(y/100), B = 2-A+Math.floor(A/4); return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5; }
function sunPos(jd){
  const D = jd-2451545, g = fix(357.529+0.98560028*D,360), q = fix(280.459+0.98564736*D,360);
  const L = fix(q+1.915*dsin(g)+0.020*dsin(2*g),360), e = 23.439-0.00000036*D;
  const RA = darctan2(dcos(e)*dsin(L), dcos(L))/15;
  return {decl: darcsin(dsin(e)*dsin(L)), eqt: q/15 - fix(RA,24)};
}
const ptCache = {};
function prayerTimes(date){
  const P = S.prayer; if(!P) return null;
  const ck = keyOf(date)+P.lat+P.lng+P.method;
  if(ptCache[ck]) return ptCache[ck];
  const m = METHODS[P.method] || METHODS.uoif, lat = P.lat, lng = P.lng;
  const jd = julian(date.getFullYear(), date.getMonth()+1, date.getDate()) - lng/(15*24);
  const tz = -new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12).getTimezoneOffset()/60;
  const mid = t => fix(12 - sunPos(jd+t).eqt, 24);
  const angT = (a,t,ccw) => { const {decl} = sunPos(jd+t); const x = (-dsin(a)-dsin(decl)*dsin(lat))/(dcos(decl)*dcos(lat)); if(x<-1||x>1) return NaN; const T = darccos(x)/15; return mid(t)+(ccw?-T:T); };
  const asrT = (f,t) => { const {decl} = sunPos(jd+t); return angT(-darccot(f+dtan(Math.abs(lat-decl))), t, false); };
  let t = {fajr:5,sunrise:6,dhuhr:12,asr:13,sunset:18,isha:18};
  for(let i=0;i<2;i++){
    const n = {
      fajr:angT(m.f,t.fajr/24,true), sunrise:angT(0.833,t.sunrise/24,true), dhuhr:mid(t.dhuhr/24),
      asr:asrT(1,t.asr/24), sunset:angT(0.833,t.sunset/24,false), isha:angT(m.i,t.isha/24,false)
    };
    for(const k in n) if(!isNaN(n[k])) t[k] = n[k]; else if(i===1) t[k] = NaN;
  }
  const night = 24 - (t.sunset - t.sunrise);
  const pf = m.f/60*night, pi = m.i/60*night;
  if(isNaN(t.fajr) || t.sunrise - t.fajr > pf) t.fajr = t.sunrise - pf;
  if(isNaN(t.isha) || t.isha - t.sunset > pi) t.isha = t.sunset + pi;
  const adj = tz - lng/15;
  const out = {};
  for(const k in t) out[k] = t[k] + adj;
  out.dhuhr += 2/60;
  out.maghrib = out.sunset;
  return ptCache[ck] = out;
}
function hm(h){ if(h==null || isNaN(h)) return "--:--"; let mins = Math.round(h*60); mins = ((mins%1440)+1440)%1440; return `${pad(Math.floor(mins/60))}:${pad(mins%60)}`; }

function parcoursDay(d){
  if(!S.parcours || !PARCOURS[S.parcours.id]) return 0;
  const n = diffDays(d, fromKey(S.parcours.start)) + 1;
  return (n>=1 && n<=PARCOURS_DAYS) ? n : 0;
}
function hasObjective(d){ return !!(S.objective && keyOf(d) >= S.objective.since); }
const MINIMUM = ["fajr","sayyid","hayy"];
const RAMP1 = ["fajr","sayyid","istighfar"];
function rampWeek(d){
  if(!S.rampStart) return 0;
  const k = keyOf(d);
  if(k < S.rampStart || (S.rampDone && k >= S.rampDone)) return 0;
  const n = diffDays(d, fromKey(S.rampStart));
  return n < 7 ? 1 : n < 14 ? 2 : 0;
}
function isLight(d){ const r = rec(keyOf(d)); return !!(r && r.light); }
function structure(d){
  const n = parcoursDay(d);
  if(isLight(d)) return {socle:MINIMUM.slice(), theme:[], parc:[], obj:false, pday:n, light:true, ramp:0};
  const ramp = rampWeek(d);
  const socle = ramp === 1 ? RAMP1.slice() : SOCLE.slice();
  const theme = ramp ? [] : DAYS[d.getDay()].items.slice();
  const seen = new Set([...socle, ...theme]);
  let parc = [];
  if(n){
    const du = PARCOURS[S.parcours.id].duas;
    for(let i=0;i<du.length;i++){ const id = du[(n-1+i) % du.length]; if(!seen.has(id)){ parc.push(id); break; } }
    parc.push("pact");
  }
  return {socle, theme, parc, obj: hasObjective(d), pday:n, light:false, ramp};
}
function isOptional(id, s){ const it = ITEMS[id]; return !!(it && (it.optional || (it.task && s.parc.includes("pact")))); }
function countable(d){
  const s = structure(d);
  const ids = [...s.socle, ...s.theme, ...s.parc].filter(id=>!isOptional(id,s));
  if(s.obj) ids.unshift("obj");
  return ids;
}
function getItem(id, d){
  if(id === "obj") return {kind:"objective", title:"Mon objectif"};
  if(id === "pact"){
    const p = PARCOURS[S.parcours.id], n = parcoursDay(d) || 1;
    return {kind:"action", task:true, title:"Le geste du parcours", moment:`${p.title}, jour ${n} sur ${PARCOURS_DAYS}`, desc:p.actions[(n-1) % p.actions.length]};
  }
  return ITEMS[id];
}
function slotsOf(id){ const it = ITEMS[id]; return (it && it.slots) || [{l:"Fait",t:1}]; }
function rec(dk){ return S.days[dk]; }
function ensure(dk){
  if(!S.days[dk]) S.days[dk] = {c:{}, note:""};
  if(!S.start || dk < S.start) S.start = dk;
  return S.days[dk];
}
function val(dk,k){ const r = rec(dk); return r && r.c && r.c[k] ? r.c[k] : 0; }
function itemPct(dk,id){
  const sl = slotsOf(id);
  return sl.reduce((a,s,i)=> a + Math.min(val(dk,`${id}:${i}`)/s.t,1), 0) / sl.length;
}
function dayPct(d){
  const dk = keyOf(d);
  if(!rec(dk)) return 0;
  const ids = countable(d);
  return ids.reduce((a,id)=>a+itemPct(dk,id),0)/ids.length;
}
function countDone(dk, ids){ return ids.filter(id=>itemPct(dk,id)>=1).length; }
function streaks(){
  const t = today();
  let cur = 0, d = new Date(t);
  if(dayPct(d) < HELD) d = addDays(d,-1);
  while(dayPct(d) >= HELD){ cur++; d = addDays(d,-1); }
  let best = 0, run = 0;
  if(S.start) for(let x = fromKey(S.start); x <= t; x = addDays(x,1)){ if(dayPct(x) >= HELD){ run++; best = Math.max(best,run); } else run = 0; }
  return {cur, best:Math.max(best,cur)};
}

let starUid = 0;
function starPoints(cx,cy,R){

  return pts.join(" ");
}

    <polygon class="star-base" points="${pts}"/>

/* =========================================================
   LA JOURNÉE PAR MOMENTS
   ========================================================= */
const textState = {};
const momentOpen = {};
const MOMENT_LABEL = {matin:"Le matin", jour:"Dans la journée", soir:"Le soir", actions:"Mes actions"};
function plan(d){
  const s = structure(d), out = {s, sections:{matin:[],jour:[],soir:[]}, actions:[]};
  const origin = {}; s.socle.forEach(i=>origin[i]="socle"); s.theme.forEach(i=>origin[i]="theme"); s.parc.forEach(i=>origin[i]="parc");
  if(s.obj) out.actions.push({id:"obj", origin:"obj", m:"actions", sl:[0], opt:false});
  const tasks = [];
  for(const id of [...s.socle, ...s.theme, ...s.parc]){
    const it = getItem(id,d), opt = isOptional(id,s);
    if(it.task){ tasks.push({id, origin:origin[id], m:"actions", sl:[0], opt}); continue; }
    const sl = slotsOf(id);
    if(sl.length === 2 && sl[0].l === "Matin" && sl[1].l === "Soir"){
      out.sections.matin.push({id, origin:origin[id], m:"matin", sl:[0], opt});
      out.sections.soir.push({id, origin:origin[id], m:"soir", sl:[1], opt});
    } else {
      out.sections[MOMENT_OF[id]||"jour"].push({id, origin:origin[id], m:MOMENT_OF[id]||"jour", sl:sl.map((_,i)=>i), opt});
    }
  }
  tasks.sort((a,b)=> (a.id==="pact"?-1:0) - (b.id==="pact"?-1:0));
  out.actions.push(...tasks);
  return out;
}
function entryPct(dk, e){ const sl = slotsOf(e.id); return e.sl.reduce((a,i)=>a+Math.min(val(dk,`${e.id}:${i}`)/sl[i].t,1),0)/e.sl.length; }
function currentMoment(d){
  if(!sameDay(d,today())) return null;
  const now = new Date(), h = now.getHours()+now.getMinutes()/60, pt = prayerTimes(d);
  if(pt) return h < pt.dhuhr ? "matin" : h >= pt.asr ? "soir" : "jour";
  return h < 12 ? "matin" : h < 16 ? "jour" : "soir";
}
function momentSub(m, d){
  const pt = prayerTimes(d);
  if(m === "matin") return pt ? `Après le Fajr, ${hm(pt.fajr)}` : "Après la prière du Fajr";
  if(m === "soir") return pt ? `De ${hm(pt.asr)} au Maghreb, ${hm(pt.maghrib)}` : "Après le ʿAsr";
  if(m === "actions") return "L’effort qui accompagne l’invocation";
  return "Quand tu veux, au fil de la journée";
}
function isSecOpen(m, d, cur){
  const k = keyOf(d)+m;
  if(k in momentOpen) return momentOpen[k];
  if(m === "actions") return true;
  return cur ? m === cur : true;
}
function secCount(list, dk){ const req = list.filter(e=>!e.opt); return {done:req.filter(e=>entryPct(dk,e)>=1).length, total:req.length}; }
function momentSection(m, list, d, cur){
  const dk = keyOf(d), c = secCount(list, dk), open = isSecOpen(m, d, cur);
  const cls = ["msec"]; if(!open) cls.push("closed"); if(cur===m) cls.push("now"); if(c.total && c.done===c.total) cls.push("alldone");
  return `<section class="${cls.join(" ")}" id="sec-${m}">
    <button class="mhead" data-act="msec" data-m="${m}" aria-expanded="${open}"><h2>${MOMENT_LABEL[m]}${cur===m?`<span class="nowtag">Maintenant</span>`:""}<small>${momentSub(m,d)}</small></h2><span class="count" id="cnt-${m}">${c.done} sur ${c.total}</span><span class="chev" aria-hidden="true"></span></button>
    <div class="mbody">${list.map(e=>entryCard(e,d)).join("")}</div></section>`;
}
function textOpen(id, it){

}
const ORIGIN_TAG = {theme:t=>`<span class="tag t-theme">Thème du ${t}</span>`, parc:()=>`<span class="tag t-parc">Parcours</span>`};
function entryCard(e, d){

    ${it.desc?`<p class="desc">${it.desc}</p>`:""}
    ${open ? `${texts({...it, desc:null})}
      ${it.src?`<p class="src"><b>Source :</b> ${it.src}</p>`:""}
      ${it.note?`<details data-id="${e.id}"${openSet.has(e.id)?" open":""}><summary>${sumLabel}</summary><p>${it.note}</p></details>`:""}` : ""}
    ${hasText?`<button class="txtbtn" data-act="txt" data-id="${e.id}" aria-expanded="${open}">${open?"Masquer le texte":(it.kind==="dua"?"Lire l’invocation":"Voir la source")}</button>`:""}
    <div class="slots">${slotsHTML(e.id, dk, e.sl)}</div>

}
function entryFromEl(el){ return {id:el.dataset.id, m:el.dataset.m, origin:el.dataset.origin, sl:el.dataset.sl.split(",").map(Number), opt:el.dataset.opt==="1"}; }
function nextStepHTML(d, P){

function renderStudy(){

    ${it.ph?`<p class="ph">${maskText(it.ph,lvl,false)}</p>`:""}
    <div class="studyactions">

        : study.revealed ? `<button data-act="grade" data-g="0">À revoir</button><button class="ok" data-act="grade" data-g="1">Je l’ai sue</button>`
        : `<button class="ok" data-act="reveal">Révéler le texte</button>`}
    </div>

function gradeCard(ok){
  const id = study.queue[study.i], L = S.learn[id] || (S.learn[id] = {lvl:0,next:keyOf(today())});
  if(ok){ L.lvl = Math.min(L.lvl+1, INTERVALS.length-1); L.next = keyOf(addDays(today(), INTERVALS[L.lvl])); if(L.lvl===MASTER){ if(!L.mastered) L.mastered = keyOf(today()); toast(`${ITEMS[id].title} : sue par cœur, mâ shâ’ Allâh`); } }
  else { L.lvl = Math.max(L.lvl-1, 1); L.next = keyOf(addDays(today(),1)); }
  save();
  study.i++; study.revealed = false;
  if(study.i >= study.queue.length){ study = null; toast("Révision terminée"); }
  render(); window.scrollTo(0,0);
}

/* =========================================================
   VUE : SUIVI
   ========================================================= */
function renderSuivi(){
  const t = today(), {cur,best} = streaks();
  const m0 = new Date(t.getFullYear(), t.getMonth(), 1);
  let heldMonth = 0; for(let x = new Date(m0); x <= t; x = addDays(x,1)) if(dayPct(x)>=HELD) heldMonth++;
  const start = weekRef, end = addDays(start,6), isCurrent = sameDay(start, monday(t));
  let rows = "";
  for(let i=0;i<7;i++){
    const d = addDays(start,i), future = d > t, p = future ? 0 : dayPct(d), day = DAYS[d.getDay()];
    rows += `<button class="dayrow ${sameDay(d,t)?"is-today":""}" data-act="goto" data-d="${keyOf(d)}" ${future?"disabled":""}>
      ${starSVG(p)}<span><span class="dn">${day.name} ${d.getDate()}</span><br><span class="dt">${day.theme}</span></span><span class="dp">${future?"":Math.round(p*100)+" %"}</span></button>`;
  }
  const startHeat = addDays(monday(t), -28);
  let cells = ["L","M","M","J","V","S","D"].map(h=>`<span class="hd">${h}</span>`).join("");
  for(let i=0;i<35;i++){
    const d = addDays(startHeat,i), dk = keyOf(d);
    if(d > t || !S.start || dk < S.start){ cells += `<span class="cell out" aria-hidden="true"></span>`; continue; }
    const p = dayPct(d), l = p>=1?4 : p>=.8?3 : p>=.5?2 : p>0?1 : 0;
    cells += `<button class="cell l${l} ${sameDay(d,t)?"now":""}" data-act="goto" data-d="${dk}" aria-label="${DAYS[d.getDay()].name} ${fmtShort(d)} : ${Math.round(p*100)} %">${d.getDate()}</button>`;
  }
  const acc = {};
  if(S.start) for(let i=0;i<14;i++){
    const d = addDays(t,-i), dk = keyOf(d);
    if(dk < S.start) break;
    if(i===0 && dayPct(d) < 1) continue;
    for(const id of countable(d)){ const k = id==="pact" ? "pact" : id; acc[k] = acc[k]||{s:0,n:0}; acc[k].s += itemPct(dk,id); acc[k].n++; }
  }
  const title = id => id==="obj" ? "Action de mon objectif" : id==="pact" ? "Geste du parcours" : ITEMS[id].title;
  const neg = Object.entries(acc).map(([id,a])=>({id,p:a.s/a.n,n:a.n})).sort((a,b)=>a.p-b.p).slice(0,5);
  const answered = S.carnet.filter(x=>x.status==="ok").length;
  return `<div class="page"><h1>Ton suivi</h1></div>
  <div class="stats">
    <div class="stat"><b>${cur}</b><span>jour${cur>1?"s":""} tenu${cur>1?"s":""} d’affilée</span></div>
    <div class="stat"><b>${best}</b><span>meilleure série</span></div>
    <div class="stat"><b>${heldMonth}</b><span>jours tenus en ${MONTHS[t.getMonth()]}</span></div>
  </div>
  <div class="row" style="margin:0 0 18px"><button class="navbtn primary" data-act="bkind" data-k="semaine" onclick="location.hash='#bilan'">Bilan de la semaine</button><button class="navbtn strong" data-act="bkind" data-k="mois" onclick="location.hash='#bilan'">Bilan du mois</button></div>
  <p class="secintro" style="margin:0 0 22px">Un jour est « tenu » quand tu atteins 80 % de son programme. Les jeûnes facultatifs ne comptent pas. ${answered?`Ton carnet compte ${answered} invocation${answered>1?"s":""} exaucée${answered>1?"s":""}.`:""}</p>
  <section class="sec"><div class="sechead"><h2>Mon binôme</h2></div>${binomeSummary()}</section>
  <section class="sec">
    <div class="weeknav"><button class="iconbtn" data-act="wprev" aria-label="Semaine précédente">${ICON.left}</button>
      <div style="text-align:center"><h3>${isCurrent?"Cette semaine":"Semaine du "+fmtShort(start)}</h3><p>Du ${fmtShort(start)} au ${fmtShort(end)}</p></div>
      <button class="iconbtn" data-act="wnext" aria-label="Semaine suivante" ${isCurrent?"disabled":""}>${ICON.right}</button></div>
    ${rows}</section>
  <section class="sec"><div class="sechead"><h2>Les cinq dernières semaines</h2></div>
    <div class="heat">${cells}</div>
    <div class="legend">Moins <span class="cell l0"></span><span class="cell l1"></span><span class="cell l2"></span><span class="cell l3"></span><span class="cell l4"></span> Plus</div></section>
  <section class="sec"><div class="sechead"><h2>À renforcer</h2><span class="count">14 derniers jours</span></div>
    <p class="secintro">Ce que tu fais le moins souvent, du plus négligé au moins négligé.</p>
    ${neg.length?`<ul class="neg">${neg.map(x=>`<li><span>${title(x.id)}</span><span class="np">${Math.round(x.p*100)} % sur ${x.n} jour${x.n>1?"s":""}</span><span class="nb"><i style="width:${Math.max(x.p*100,2)}%"></i></span></li>`).join("")}</ul>`
      :`<p class="empty">Les données apparaîtront dès que tu auras terminé une première journée.</p>`}</section>`;
}

   VUE : BINÔME
   ========================================================= */
let B = {members:[], received:[], unsubM:null, unsubR:null, code:null, names:{}, encFor:null, state:"idle"};
function heldMap(){
  const t = today(), m = {};
  for(let i=0;i<30;i++){ const d = addDays(t,-i); if(dayPct(d) >= HELD) m[keyOf(d)] = 1; }
  return m;
}
let lastBin = "";
async function pushBinome(){
  if(store.mode !== "account" || !store.db || !store.uid) return;
  const code = S.binome?.code || "";
  const body = {code, days: code ? heldMap() : {}};
  const sig = JSON.stringify(body);
  if(sig === lastBin) return;
  try{ await store.db.doc(`binome/${store.uid}`).set({...body, updated:Date.now()}); lastBin = sig; }catch(e){}
}
function binomeSubscribe(){
  const code = S.binome?.code || null;
  if(!store.db || !store.uid) return;
  if(B.code === code && (B.unsubM || !code)) return;
  if(B.unsubM){ B.unsubM(); B.unsubM = null; }
  if(B.unsubR){ B.unsubR(); B.unsubR = null; }
  B.code = code; B.members = []; B.received = [];
  if(!code) return;
  B.state = "loading";
  const timer = setTimeout(()=>{ if(B.state==="loading"){ B.state = "slow"; rerenderIf(["binome","suivi"]); } }, 10000);
  B.unsubM = store.db.collection("binome").where("code","==",code).onSnapshot(async snap=>{
    clearTimeout(timer); B.state = "ok";
    B.members = snap.docs.map(d=>({id:d.id, ...d.data()}));
    await resolveNames(B.members.map(m=>m.id));
    rerenderIf(["binome","suivi"]);
  }, ()=>{ clearTimeout(timer); B.state = "error"; rerenderIf(["binome","suivi"]); });
  B.unsubR = store.db.collection("encouragements").where("to","==",store.uid).orderBy("at","desc").limit(20).onSnapshot(async snap=>{
    B.received = snap.docs.map(d=>d.data()).filter(x=>x.code===code);
    await resolveNames(B.received.map(x=>x.from));
    rerenderIf(["binome"]);
  }, ()=>{});
}
async function resolveNames(ids){
  if(!store.user || !ids.length) return;
  try{ const ps = await store.user.profiles(ids); for(const id of ids){ if(ps && ps[id]) B.names[id] = ps[id].name || ""; } }catch(e){}
}
function nameOf(id){ return id === store.uid ? "Toi" : (B.names[id] || "Un membre du cercle"); }
function memberRow(m){
  const t = today(), heldToday = m.days && m.days[keyOf(t)];
  const dots = Array.from({length:7},(_,i)=>{ const d = addDays(t,i-6); return `<i class="${m.days && m.days[keyOf(d)]?"on":""}" title="${fmtShort(d)}"></i>`; }).join("");
  const me = m.id === store.uid;
  return `<div class="member"><div><div class="mn"></div><div class="ms ${heldToday?"ok":""}">${heldToday?"A tenu sa journée aujourd’hui":"Journée pas encore tenue"}</div></div>
    <div class="dots" aria-label="7 derniers jours">${dots}</div>
    ${me?"":B.encFor===m.id?`<div class="enc">${ENCOURAGEMENTS.map((e,i)=>`<button class="chip" data-act="sendenc" data-to="${m.id}" data-i="${i}">${e}</button>`).join("")}</div>`
      :`<div class="enc"><button class="link" data-act="encfor" data-to="${m.id}">Envoyer un encouragement</button></div>`}
  </div>`;
}
function fillNames(root){
  root.querySelectorAll(".member").forEach((el,i)=>{ const m = B.sorted[i]; if(m) el.querySelector(".mn").textContent = nameOf(m.id); });
  root.querySelectorAll("[data-from]").forEach(el=> el.textContent = nameOf(el.dataset.from));
}
function binomeSummary(){

  <section class="sec"><div class="sechead"><h2>Membres</h2><span class="count">7 derniers jours</span></div>
    ${B.state==="loading"?`<p class="empty">Chargement du cercle…</p>`:B.state==="slow"?`<p class="empty">Le cercle ne répond pas encore. Vérifie ta connexion.</p>`:B.state==="error"?`<p class="empty">Impossible de lire le cercle pour le moment.</p>`:""}
    ${B.sorted.map(memberRow).join("")}</section>
  <section class="sec"><div class="sechead"><h2>Encouragements reçus</h2></div>
    ${recv.length?recv.map(x=>`<div class="dua"><p>${esc(ENCOURAGEMENTS[x.i]||"")}</p><p class="dt"><span data-from="${esc(x.from)}"></span>, le ${fmtShort(new Date(x.at))}</p></div>`).join(""):`<p class="empty">Aucun encouragement cette semaine.</p>`}</section>
  <p><button class="link danger" data-act="leavecircle">Quitter ce cercle</button></p>`;
  return h;

const REQ_CATS = {emploi:"Emploi et revenus", activite:"Activité et projets", dette:"Dettes", mariage:"Mariage", famille:"Famille et enfants", etudes:"Études", sante:"Santé", epreuve:"Épreuve", autre:"Autre"};
const KINDS = {exact:"Ce que j’avais demandé", better:"Autre chose, de meilleur", protect:"Un mal a été écarté", peace:"Pas encore, mais j’ai trouvé la paix"};
const DELAYS = {w:"Moins d’une semaine", m:"Quelques semaines", mo:"Quelques mois", y:"Plus d’un an"};
const GROUP_NAMES = {general:"Programme de la semaine", rizq:"Portes du rizq", dettes:"Sortir des dettes", mariage:"Mariage", etudes:"Études et examens", epreuve:"Traverser une épreuve", deuil:"Le deuil"};
const MILESTONES = [7,14,21,30,40,60,90,100,150,200,365];
let C = {tallies:[], requests:[], testis:[], state:"idle", agg:null, subs:false, owner:false, filter:"all", confirmDel:null};
let T = null; // brouillon de témoignage

function myGroup(){
  if(S.parcours && parcoursDay(today())) return S.parcours.id;
  if(S.objective && OBJ_CATS[S.objective.cat]) return OBJ_CATS[S.objective.cat].p;
  return "general";
}
function weekKeys(){ const m = monday(today()); return {ist:`ist-${keyOf(m)}`, sal:`sal-${keyOf(addDays(m,4))}`, mon:m, fri:addDays(m,4)}; }
function prune(map, days){ const lim = keyOf(addDays(today(),-days)); for(const k in map) if(map[k] < lim) delete map[k]; }
function buildTally(){
  const t = today(), days = {}, socle = {};
  for(let i=0;i<7;i++){ const d = addDays(t,-i), k = keyOf(d); if(dayPct(d) >= HELD) days[k] = 1; if(rec(k) && SOCLE.every(id=>itemPct(k,id)>=1)) socle[k] = 1; }
  const w = weekKeys();
  let ist = 0; for(let i=0;i<7;i++) ist += val(keyOf(addDays(w.mon,i)),"istighfar:0");
  prune(S.prayed, 60); prune(S.hamd, 365);
  return {group:myGroup(), days, socle, streak:streaks().cur, pday:parcoursDay(t), prayed:{...S.prayed}, hamd:{...S.hamd}, ch:{[w.ist]:ist, [w.sal]:val(keyOf(w.fri),"salawat:0")}};
}
let lastTally = "", tallyBusy = false, tallyAgain = false;
async function pushTally(){
  if(store.mode !== "account" || !store.db || !S.anonId) return;
  if(tallyBusy){ tallyAgain = true; return; }
  const body = buildTally(), sig = JSON.stringify(body);
  if(sig === lastTally) return;
  tallyBusy = true;
  try{ await store.db.doc(`tallies/${S.anonId}`).set({...body, updated:Date.now()}); lastTally = sig; }catch(e){}
  tallyBusy = false;
  if(tallyAgain){ tallyAgain = false; pushTally(); }
}
function aggregate(){
  const now = Date.now(), tk = keyOf(today()), w = weekKeys();
  const a = {active:0, held:0, socle:0, groups:{}, prayed:{}, hamd:{}, ist:0, sal:0, mine:null};
  for(const t of C.tallies){
    if(t.id === S.anonId) a.mine = t;
    for(const k in (t.prayed||{})) a.prayed[k] = (a.prayed[k]||0)+1;
    for(const k in (t.hamd||{})) a.hamd[k] = (a.hamd[k]||0)+1;
    a.ist += (t.ch && t.ch[w.ist]) || 0; a.sal += (t.ch && t.ch[w.sal]) || 0;
    if(now - (t.updated||0) > 14*864e5) continue;
    a.active++;
    const held = t.days && t.days[tk];
    if(held) a.held++;
    if(t.socle && t.socle[tk]) a.socle++;
    const g = GROUP_NAMES[t.group] ? t.group : "general";
    a.groups[g] = a.groups[g] || {m:0,h:0}; a.groups[g].m++; if(held) a.groups[g].h++;
  }
  C.agg = a;
}
/* Mes propres actions comptent tout de suite, même avant la synchronisation */
function liveCount(mapName, id){
  const a = C.agg || {prayed:{},hamd:{},mine:null};
  const remoteMine = a.mine && a.mine[mapName] && a.mine[mapName][id] ? 1 : 0;
  return (a[mapName][id]||0) - remoteMine + (S[mapName][id] ? 1 : 0);
}
function liveTotals(){
  const a = C.agg || {ist:0,sal:0,mine:null}, w = weekKeys(), mineCh = (a.mine && a.mine.ch) || {};
  let ist = 0; for(let i=0;i<7;i++) ist += val(keyOf(addDays(w.mon,i)),"istighfar:0");
  const sal = val(keyOf(w.fri),"salawat:0");
  return {ist: a.ist - (mineCh[w.ist]||0) + ist, sal: a.sal - (mineCh[w.sal]||0) + sal, myIst:ist, mySal:sal};
}
function commuSubscribe(){
  if(C.subs || store.mode !== "account" || !store.db) return;
  C.subs = true; C.state = "loading";
  const timer = setTimeout(()=>{ if(C.state==="loading"){ C.state = "slow"; refreshCommu(); } }, 10000);
  const done = ()=>{ clearTimeout(timer); if(C.state!=="error") C.state = "ok"; };
  store.db.collection("tallies").onSnapshot(snap=>{ done(); C.tallies = snap.docs.map(d=>({id:d.id, ...d.data()})); aggregate(); refreshCommu(); }, ()=>{ C.state = "error"; refreshCommu(); });
  store.db.collection("requests").orderBy("at","desc").limit(100).onSnapshot(snap=>{ done(); C.requests = snap.docs.map(d=>({id:d.id, ...d.data()})); refreshCommu(); }, ()=>{});
  store.db.collection("testimonies").orderBy("at","desc").limit(100).onSnapshot(snap=>{ done(); C.testis = snap.docs.map(d=>({id:d.id, ...d.data()})); refreshCommu(); }, ()=>{});
}
function refreshCommu(){
  if(view === "jour"){ const el = document.getElementById("commu-banner"); if(el) el.outerHTML = commuBanner(); return; }
  rerenderIf(["communaute","demandes","exaucees"]);
}
function ago(ts){
  const m = Math.floor((Date.now()-ts)/60000);
  if(m < 1) return "à l’instant"; if(m < 60) return `il y a ${m} min`;
  const h = Math.floor(m/60); if(h < 24) return `il y a ${h} h`;
  const d = new Date(ts); return sameDay(d, addDays(today(),-1)) ? "hier" : `le ${fmtShort(d)}`;
}
function niceGoal(n, min){ const v = Math.max(min, n); const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v/p)*p; }

function commuGate(){
  if(store.mode !== "account") return `<p class="empty">La communauté a besoin que tu sois connecté à ton compte.</p>`;

let BL = {kind:"semaine", ref:monday(today())};
function periodRange(kind, ref){
  if(kind === "semaine") return [ref, addDays(ref,6)];
  return [ref, new Date(ref.getFullYear(), ref.getMonth()+1, 0)];
}
function periodStats(a, b){
  const t = today(), st = {n:0, held:0, sum:0, ist:0, sal:0, obj:0, objN:0, objActs:[], light:0, items:{}, notes:[], days:[]};
  for(let d = new Date(a); d <= b; d = addDays(d,1)){
    const k = keyOf(d);
    if(d > t || !S.start || k < S.start){ st.days.push({d, p:null}); continue; }
    const p = dayPct(d); st.days.push({d, p});
    st.n++; st.sum += p; if(p >= HELD) st.held++;
    st.ist += val(k,"istighfar:0"); st.sal += val(k,"salawat:0");
    const r = rec(k);
    if(r && r.light) st.light++;
    if(hasObjective(d) && !isLight(d)){ st.objN++; if(val(k,"obj:0") >= 1){ st.obj++; if(r && r.objAct) st.objActs.push({d, text:r.objAct}); } }
    if(r && r.note && r.note.trim()) st.notes.push({d, text:r.note.trim()});
    for(const id of countable(d)){ if(id==="obj") continue; const kk = id; st.items[kk] = st.items[kk] || {s:0,n:0}; st.items[kk].s += itemPct(k,id); st.items[kk].n++; }
  }
  st.avg = st.n ? st.sum/st.n : 0;
  const ak = keyOf(a), bk = keyOf(b);
  st.answered = S.carnet.filter(x=>x.status==="ok" && x.answered && x.answered >= ak && x.answered <= bk);
  st.added = S.carnet.filter(x=>x.date >= ak && x.date <= bk).length;
  st.mastered = Object.keys(S.learn).filter(id=>ITEMS[id] && S.learn[id].mastered && S.learn[id].mastered >= ak && S.learn[id].mastered <= bk);
  return st;
}
function bilanBanner(){
  const t = today();
  if(!S.start || S.start >= keyOf(t)) return "";
  if(t.getDate() === 1) return `<button class="banner" style="width:100%;text-align:left" data-act="openbilan" data-p="lastmonth"><b>Ton bilan de ${MONTHS[addDays(t,-1).getMonth()]} est prêt.</b><span>Prends une minute pour regarder ton mois.</span></button>`;

  return "";
}
const itemTitle = id => id==="pact" ? "Le geste du parcours" : (ITEMS[id] ? ITEMS[id].title : id);
function renderBilan(){
  const [a,b] = periodRange(BL.kind, BL.ref), t = today();
  const isWeek = BL.kind === "semaine";
  const st = periodStats(a,b);
  const prevRef = isWeek ? addDays(BL.ref,-7) : new Date(BL.ref.getFullYear(), BL.ref.getMonth()-1, 1);
  const [pa,pb] = periodRange(BL.kind, prevRef), prev = periodStats(pa,pb);
  const isCurrent = a <= t && t <= b;
  const title = isWeek ? (isCurrent ? "Cette semaine" : `Semaine du ${fmtShort(a)}`) : `${MONTHS[a.getMonth()][0].toUpperCase()+MONTHS[a.getMonth()].slice(1)} ${a.getFullYear()}`;
  let h = `<div class="page"><h1>Mon bilan</h1></div>
  <nav class="seg" aria-label="Période"><a href="#bilan" data-act="bkind" data-k="semaine" ${isWeek?'aria-current="page"':""}>Semaine</a><a href="#bilan" data-act="bkind" data-k="mois" ${!isWeek?'aria-current="page"':""}>Mois</a></nav>
  <div class="bnav"><button class="iconbtn" data-act="bprev" aria-label="Période précédente">${ICON.left}</button>
    <div><h3>${title}</h3><p class="secintro" style="margin:0;text-align:center">Du ${fmtShort(a)} au ${fmtShort(b)}</p></div>
    <button class="iconbtn" data-act="bnext" aria-label="Période suivante" ${isCurrent||b>t?"disabled":""}>${ICON.right}</button></div>`;
  if(!st.n) return h + `<p class="empty">Aucune journée enregistrée sur cette période.</p>`;
  let delta = "";
  if(prev.n){ const dp = Math.round((st.avg - prev.avg)*100); delta = dp > 0 ? `${dp} points de plus que ${isWeek?"la semaine":"le mois"} précédent${isWeek?"e":""}.` : dp < 0 ? `${-dp} points de moins que ${isWeek?"la semaine":"le mois"} précédent${isWeek?"e":""}. Ce n’est pas grave : l’important est de continuer.` : `Aussi régulier que ${isWeek?"la semaine":"le mois"} précédent${isWeek?"e":""}.`; }
  h += `<div class="pulse"><b>${st.held} / ${st.n}</b><p>jour${st.held>1?"s":""} tenu${st.held>1?"s":""}${isCurrent?" jusqu’ici":""}, avec une moyenne de ${Math.round(st.avg*100)} %.</p>${delta?`<p class="delta">${delta}</p>`:""}</div>`;
  if(isWeek){
    h += `<div class="wkstars">${st.days.map(x=>`<div>${starSVG(x.p||0)}<span>${DAYS[x.d.getDay()].name.slice(0,3)}</span></div>`).join("")}</div>`;
  } else {
    const lead = (a.getDay()+6)%7;
    let cells = ["L","M","M","J","V","S","D"].map(x=>`<span class="hd">${x}</span>`).join("") + Array.from({length:lead},()=>`<span></span>`).join("");
    for(const x of st.days){
      if(x.p == null){ cells += `<span class="cell out" aria-hidden="true">${x.d.getDate()}</span>`; continue; }
      const l = x.p>=1?4 : x.p>=.8?3 : x.p>=.5?2 : x.p>0?1 : 0;
      cells += `<button class="cell l${l}" data-act="goto" data-d="${keyOf(x.d)}" aria-label="${fmtShort(x.d)} : ${Math.round(x.p*100)} %">${x.d.getDate()}</button>`;
    }
    h += `<div class="heat" style="margin-bottom:18px">${cells}</div>`;
  }
  h += `<div class="stats"><div class="stat"><b>${nf(st.ist)}</b><span>istighfâr</span></div>${st.sal?`<div class="stat"><b>${nf(st.sal)}</b><span>salawat</span></div>`:""}${st.objN?`<div class="stat"><b>${st.obj} / ${st.objN}</b><span>actions pour ton objectif</span></div>`:""}</div>`;
  const items = Object.entries(st.items).filter(([,v])=>v.n>=2).map(([id,v])=>({id, p:v.s/v.n, n:v.n}));
  const best = items.filter(x=>x.p>=.8).sort((x,y)=>y.p-x.p).slice(0,3);
  const weak = items.filter(x=>x.p<.6).sort((x,y)=>x.p-y.p).slice(0,3);
  if(best.length) h += `<section class="sec"><div class="sechead"><h2>Ce qui a bien marché</h2></div><ul class="blist">${best.map(x=>`<li>${itemTitle(x.id)}<small>${Math.round(x.p*100)} % des jours</small></li>`).join("")}</ul></section>`;
  if(weak.length) h += `<section class="sec"><div class="sechead"><h2>À renforcer</h2></div><ul class="blist">${weak.map(x=>`<li>${itemTitle(x.id)}<small>${Math.round(x.p*100)} % des jours</small></li>`).join("")}</ul>
    <p class="secintro" style="margin-top:10px">${st.light?`Tu as utilisé le minimum du jour ${st.light} fois : c’est fait pour ça. `:""}Si une invocation te pèse, commence par l’apprendre dans l’onglet Apprendre : on fait plus facilement ce qu’on connaît par cœur.</p></section>`;
  if(st.objActs.length) h += `<section class="sec"><div class="sechead"><h2>Mon objectif</h2><span class="count">${esc(S.objective?.title||"")}</span></div><ul class="blist">${st.objActs.slice(-10).reverse().map(x=>`<li>${esc(x.text)}<small>${DAYS[x.d.getDay()].name} ${fmtShort(x.d)}</small></li>`).join("")}</ul></section>`;
  if(st.answered.length || st.added) h += `<section class="sec"><div class="sechead"><h2>Mon carnet</h2></div>
    ${st.answered.length?`<ul class="blist">${st.answered.map(x=>`<li>${esc(x.text)}<small>Exaucée le ${fmtShort(fromKey(x.answered))}</small></li>`).join("")}</ul>`:""}
    ${st.added?`<p class="secintro" style="margin-top:10px">${st.added} nouvelle${st.added>1?"s":""} invocation${st.added>1?"s":""} notée${st.added>1?"s":""} dans ton carnet.</p>`:""}</section>`;
  if(st.mastered.length) h += `<section class="sec"><div class="sechead"><h2>Appris par cœur</h2></div><ul class="blist">${st.mastered.map(id=>`<li>${ITEMS[id].title}</li>`).join("")}</ul></section>`;
  if(st.notes.length) h += `<section class="sec"><div class="sechead"><h2>Mes notes</h2></div><ul class="blist">${st.notes.slice(-10).reverse().map(x=>`<li>${esc(x.text.length>220?x.text.slice(0,220)+"…":x.text)}<small>${DAYS[x.d.getDay()].name} ${fmtShort(x.d)}</small></li>`).join("")}</ul></section>`;
  h += `<div class="acc"><p>« Les œuvres les plus aimées d’Allah sont les plus régulières, même si elles sont peu nombreuses. »</p><p class="src"><b>Source :</b> Al-Bukhârî (n° 6464) ; Muslim (n° 783)</p></div>`;
  return h;
}
